<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>THE BLACK SYSTEM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ===== CSS ===== -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #111 0%, #000 70%);
      color: #0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* تأثير التشويش */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      animation: noise 0.2s infinite;
    }

    @keyframes noise {
      0% { transform: translate(0,0); }
      50% { transform: translate(-1px,1px); }
      100% { transform: translate(1px,-1px); }
    }

    .container {
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 3.5rem;
      letter-spacing: 4px;
      color: #0f0;
      text-shadow:
        0 0 5px #0f0,
        0 0 15px #0f0,
        0 0 30px #00ff88;
      animation: flicker 3s infinite;
    }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
      }
      20%, 24%, 55% {
        opacity: 0.4;
      }
    }

    p {
      margin-top: 20px;
      color: #ccc;
      font-size: 1rem;
      opacity: 0.8;
    }

    button {
      margin-top: 40px;
      padding: 15px 40px;
      background: transparent;
      border: 2px solid #0f0;
      color: #0f0;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 2px;
      transition: 0.3s;
      box-shadow: 0 0 10px #0f0;
    }

    button:hover {
      background: #0f0;
      color: #000;
      box-shadow: 0 0 30px #0f0;
    }

    .warning {
      margin-top: 30px;
      color: red;
      font-size: 0.9rem;
      opacity: 0;
      transition: 0.5s;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>THE BLACK SYSTEM</h1>
    <p>Accessing forbidden protocol...</p>

    <button onclick="activateSystem()">ENTER SYSTEM</button>

    <div class="warning" id="warning">
      ⚠ SYSTEM BREACH DETECTED ⚠
    </div>
  </div>

  <!-- ===== JavaScript ===== -->
  <script>
    function activateSystem() {
      const warning = document.getElementById("warning");

      warning.style.opacity = "1";

      document.body.style.background =
        "radial-gradient(circle, #300 0%, #000 70%)";

      setTimeout(() => {
        alert("YOU ARE NOT SUPPOSED TO BE HERE...");
      }, 800);
    }
  </script>

</body>
</html>
